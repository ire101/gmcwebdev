<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --white: #fff;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <section class="container d-flex flex-column gap-3 p-4 justify-content-between mt-5 flex-md-row bg-primary mx-auto  text-light rounded-3" style="max-width: 800px;">
        <main class="d-flex gap-3 align-items-center">
            <div class="bg-light px-2 rounded">
                <i class="bi bi-fire text-danger fs-1"></i>
            </div>

            <div>
                <h5 class="mb-0  display">Daily Brain Teaser</h5>
                <p class="">Solve today's puzzle to earn 50 bonus points</p>
            </div>
        </main>
        <div>
            <button type="button" class="btn btn-light btn-outline-primary emphasis w-100">Play Now</button>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
