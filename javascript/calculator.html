<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-4">
    <h1>Calculator App</h1>
    <form>
        <div>
            <input class="form-control" type="number" id="num1" placeholder="Enter your first number">
        </div>
        <br>
        <div>
            <input class="form-control" type="number" id="num2" placeholder="Enter your second number">
        </div>
        <br>
        <div>
            <input class="form-control" type="text" id="operand" placeholder="Enter an operand e.g.(+,-,*,/)">
        </div>
        <button class="btn bg-secondary text-light mt-3" onclick="solve()">Result</button>
    </form>

    <br>
    <h6 class="display-6 mt-2 border-secondary" id="sol"> </h6>

    </div>

    <script>
        function solve() {
            num1 = document.getElementById('num1').value
            num2 = document.getElementById('num2').value
            op = document.getElementById("operand").value
            
            if(op=='+'){
                ans = Number(num1) + Number(num2)
            }
            
            else if(op=='-'){
                ans = Number(num1) - Number(num2)
            }
            
            else if(op=='*'){
                ans = Number(num1) * Number(num2)
            }
            
            else if(op=='/'){
                ans = Number(num1) / Number(num2)
            }
            
            else{
                alert("I don't know what to do")
            }
            document.getElementById('sol').innerText=ans;
        }
    </script>
</body>

</html>
